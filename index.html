<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#9fd3f0" />
<title>Glide! Prototype</title>
<style>
  :root { --ink: #ffffff; --shadow: rgba(20, 40, 60, 0.45); --accent: #ffcf5a; --sky: #9fd3f0; }
  /* the game keeps its daytime palette in both colour schemes */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #ffffff; --sky: #9fd3f0; } }
  :root[data-theme="dark"] { --ink: #ffffff; --sky: #9fd3f0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  canvas { display: block; }
  #game { position: fixed; inset: 0; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 6px var(--shadow); }
  #score { top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 800; letter-spacing: 1px; }
  #combo { top: calc(52px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 16px; font-weight: 700; color: var(--accent); opacity: 0; transition: opacity .2s; }
  #stats { bottom: calc(12px + env(safe-area-inset-bottom)); left: 16px; font-size: 14px; font-weight: 600; opacity: .9; line-height: 1.4; }
  #mist { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(255,255,255,.75), rgba(255,255,255,.98)); opacity: 0; }
  #edge { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(255, 120, 60, .8); opacity: 0; }
  .pop { position: fixed; left: 50%; top: 30%; transform: translate(-50%, 0); font-weight: 900; font-size: 24px; color: var(--accent);
    text-shadow: 0 2px 8px var(--shadow); pointer-events: none; animation: pop 1.1s ease-out forwards; white-space: nowrap; }
  .pop small { display: block; font-size: 14px; color: #fff; text-align: center; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } }
    background: linear-gradient(180deg, rgba(40,80,120,.25), rgba(40,80,120,.55)); }
  #hp { top: calc(12px + env(safe-area-inset-top)); left: 16px; font-size: 22px; letter-spacing: 2px; color: #ff6b6b; }
  #radar { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 112px; height: 112px; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #darts { top: calc(44px + env(safe-area-inset-top)); left: 16px; font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #7af0ff; display: flex; align-items: center; gap: 5px; opacity: 0; transition: opacity .3s; }
  #darts i { width: 8px; height: 22px; border-radius: 4px 4px 1px 1px; background: #7af0ff; box-shadow: 0 0 6px var(--shadow); }
  #darts i.off { background: rgba(255,255,255,.18); }
  #darts i.cd { background: linear-gradient(to top, #7af0ff var(--p), rgba(255,255,255,.18) var(--p)); }
  #darts.ready b { color: #fff; }
  #warn { top: calc(84px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 900; color: #ff5a4a; letter-spacing: 3px; opacity: 0; }
  #downcam { position: fixed; inset: 0; pointer-events: none; display: none; }
  #downcam.on { display: block; }
  #downcam::before, #downcam::after { content: ''; position: fixed; left: 0; right: 0; height: 9vh; background: #000; opacity: .85; }
  #downcam::before { top: 0; } #downcam::after { bottom: 0; }
  #downcam .lab { position: fixed; left: 0; right: 0; top: calc(9vh + 14px); text-align: center; text-shadow: 0 2px 6px var(--shadow); }
  #downcam .lab b { display: block; font-size: 15px; font-weight: 900; letter-spacing: 4px; color: #ff5a4a; }
  #downcam .lab span { display: block; font-size: 22px; font-weight: 800; }
  #downcam .bar { position: fixed; left: 20%; right: 20%; bottom: calc(9vh + 18px); height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); }
  #downcam .bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: #fff; }
  #downcam .skip { position: fixed; left: 0; right: 0; bottom: calc(9vh / 2 - 8px); text-align: center; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.75); }
  #fire { position: fixed; right: 20px; bottom: calc(146px + env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.75); background: rgba(255,90,60,.35); display: none; pointer-events: none;
    align-items: center; justify-content: center; font-weight: 900; font-size: 15px; letter-spacing: 1px; }
  #dartBtn { position: fixed; right: 20px; bottom: calc(244px + env(safe-area-inset-bottom)); width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.75); background: rgba(70,200,230,.35); display: none; pointer-events: none;
    align-items: center; justify-content: center; font-weight: 900; font-size: 13px; letter-spacing: 1px; }
  #dartBtn.dim { opacity: .4; }
  .ret { position: fixed; left: 0; top: 0; width: 30px; height: 30px; margin: -17px 0 0 -17px; border: 2px solid #ff5a4a; border-radius: 4px;
    pointer-events: none; display: none; box-shadow: 0 0 6px var(--shadow); }
  .ret.prey { border-color: #ffb347; }
  .ret.lock { border-color: #fff; border-radius: 50%; border-width: 3px; }
  .ret.mylocking { border-color: #7af0ff; border-style: dashed; }
  .ret.mylocked { border-color: #7af0ff; border-radius: 50%; border-width: 3px; }
  .ret.ally { border-style: dotted; opacity: .7; }
  .ret.dart { border-color: #ff3b2e; border-width: 3px; width: 22px; height: 22px; margin: -13px 0 0 -13px; background: rgba(255,59,46,.25); }
  /* lead marker: aim the gun cross at it */
  .lead { position: fixed; left: 0; top: 0; width: 18px; height: 18px; margin: -11px 0 0 -11px; border: 2px solid #ff5a4a; border-radius: 50%;
    pointer-events: none; display: none; box-shadow: 0 0 4px var(--shadow); }
  .lead::after { content: ''; position: absolute; left: 7px; top: 7px; width: 4px; height: 4px; border-radius: 50%; background: #fff; }
  #gunCross { position: fixed; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; display: none; }
  #gunCross::before, #gunCross::after { content: ''; position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 3px var(--shadow); }
  #gunCross::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #gunCross::after { top: 10px; left: 0; height: 2px; width: 22px; }
  .ret.dart span { transform: translateX(-50%) rotate(-45deg); color: #ff8a80; }
  .ret span { position: absolute; top: -19px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; white-space: nowrap; color: #fff; }
  #wave { top: calc(14px + env(safe-area-inset-top)); right: 16px; font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #fff; }
  /* online: scoreboard (top right, under the wave), kill feed (left), room menu */
  #board { top: calc(40px + env(safe-area-inset-top)); right: 16px; font-size: 13px; font-weight: 800; min-width: 130px; display: none; }
  #board b { display: block; font-size: 11px; letter-spacing: 2px; opacity: .8; margin-bottom: 2px; text-align: right; }
  #board div { display: flex; gap: 8px; justify-content: flex-end; }
  #board div.me span { text-decoration: underline; }
  #board i { font-style: normal; min-width: 18px; text-align: right; color: #fff; }
  #board i.d { opacity: .6; }
  #board div.teamrow { margin-top: 4px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  #board div.teamrow i { color: inherit; }
  #feed { top: calc(76px + env(safe-area-inset-top)); left: 16px; font-size: 13px; font-weight: 700; line-height: 1.5; display: none; max-width: 45vw; }
  /* ---------- Overlay: title menu, lobby and crash screens ---------- */
  #overlay { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; text-align: center; overflow-y: auto;
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    box-sizing: border-box; background: radial-gradient(ellipse at 50% 40%, rgba(30,60,90,.08), rgba(20,45,70,.5)); -webkit-overflow-scrolling: touch; }
  #overlay.hidden { display: none; }
  #overlay p { margin: 6px 0; font-size: 16px; }
  #overlay .go { margin-top: 14px; font-size: 18px; font-weight: 800; color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .menu { width: min(460px, 100%); margin: auto 0; } /* centred when it fits, scrolls from the top when it doesn't */
  .menu h1 { font-size: clamp(44px, min(13vw, 13vh), 92px); line-height: 1; margin: 4px 0 14px; letter-spacing: 1px; font-weight: 900;
    text-shadow: 0 4px 0 rgba(20,45,70,.25), 0 8px 26px rgba(20,40,60,.45); }
  .panel { --line: rgba(255,255,255,.16); text-align: left; padding: 14px; border-radius: 22px; border: 1px solid var(--line);
    background: rgba(18,38,58,.58); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
    box-shadow: 0 18px 50px rgba(10,25,40,.35), inset 0 1px 0 rgba(255,255,255,.12); }
  .panel.center { text-align: center; padding: 18px; }
  .panel .center { text-align: center; }
  .panel .blurb { font-size: 15px; line-height: 1.45; opacity: .9; margin: 12px 4px 4px; }
  .panel .big { font-size: 18px; font-weight: 800; }
  .panel .score { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin: 0; }
  .panel .score b { font-size: 52px; font-weight: 900; color: var(--accent); line-height: 1.1; }
  .panel .score span { font-size: 16px; font-weight: 700; opacity: .8; }
  .panel .best { font-weight: 800; opacity: .85; }
  .panel .best.new { color: var(--accent); opacity: 1; }
  .sect { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; opacity: .6; margin: 16px 6px 4px; }
  /* buttons */
  #overlay button { font: inherit; font-weight: 800; font-size: 16px; color: #fff; background: rgba(255,255,255,.1); border: 1px solid var(--line, rgba(255,255,255,.3));
    border-radius: 12px; padding: 10px 16px; min-height: 44px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: background .15s, transform .1s; }
  #overlay button:active { transform: scale(.97); }
  @media (hover: hover) { #overlay button:hover { background: rgba(255,255,255,.18); } }
  #overlay button.go-btn { background: var(--accent); color: #2b2412; border-color: transparent; box-shadow: 0 4px 0 #c99a2e; }
  @media (hover: hover) { #overlay button.go-btn:hover { background: #ffd978; } }
  #overlay button.cta { display: block; width: 100%; margin: 16px 0 4px; font-size: 22px; padding: 14px; border-radius: 16px; }
  #overlay button.cta.sel { outline: 3px solid #fff; outline-offset: 3px; }
  .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  /* mode tabs: a segmented control that shares its width between however many modes there are */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 15px; background: rgba(0,0,0,.25); }
  #overlay .tabs button { flex: 1 1 0; min-width: 84px; border: 0; background: transparent; padding: 8px 6px; border-radius: 11px; }
  #overlay .tabs button.on { background: var(--accent); color: #2b2412; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .tabs.sel { box-shadow: 0 0 0 2px var(--accent); }
  /* setting rows: label left, ◀ value ▶ right */
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 2px 4px 2px 12px;
    border-radius: 13px; box-sizing: border-box; width: 100%; }
  .opt + .opt { border-top: 1px solid rgba(255,255,255,.07); }
  .opt.sel { background: rgba(255,207,90,.16); box-shadow: inset 0 0 0 2px rgba(255,207,90,.85); border-top-color: transparent; }
  .opt.sel + .opt { border-top-color: transparent; }
  .opt .lab { font-size: 15px; font-weight: 700; display: flex; flex-direction: column; }
  .opt .lab small { font-size: 12px; font-weight: 600; opacity: .65; margin-top: 1px; }
  .opt .ctl { display: flex; align-items: center; flex: none; }
  .opt .ctl b { min-width: 118px; text-align: center; font-size: 16px; font-weight: 800; cursor: pointer; }
  #overlay .opt .ctl button { width: 40px; min-height: 40px; padding: 0; border: 0; background: transparent; font-size: 14px; opacity: .75; }
  #overlay .opt .ctl button:active { opacity: 1; }
  .opt.sel .ctl button { color: var(--accent) !important; opacity: 1 !important; }
  #overlay button.opt.toggle { margin-top: 6px; border: 0; border-top: 1px solid rgba(255,255,255,.07); border-radius: 13px; background: transparent; padding-right: 12px; text-align: left; }
  #overlay button.opt.toggle.sel { background: rgba(255,207,90,.16); }
  .opt .chev { font-size: 13px; font-weight: 700; opacity: .75; }
  /* controls list */
  .controls { text-align: left; padding: 2px 8px 6px; }
  .controls h3 { font-size: 12px; font-weight: 800; letter-spacing: 1px; opacity: .65; margin: 12px 0 6px; text-transform: uppercase; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 14px; align-items: center; }
  .keys dt { font-weight: 700; white-space: nowrap; opacity: .95; }
  .keys dd { margin: 0; opacity: .85; }
  kbd { display: inline-block; min-width: 1.5em; padding: 1px 6px; margin: 0 1px; border-radius: 6px; font: inherit; font-size: .85em; font-weight: 800; text-align: center;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); border-bottom-width: 2px; box-sizing: border-box; }
  .menu .hint { font-size: 13px; opacity: .85; margin-top: 12px; text-shadow: 0 1px 4px var(--shadow); }
  .menu .hint kbd { background: rgba(20,40,60,.4); }
  /* online */
  #overlay input { font: inherit; font-weight: 800; font-size: 17px; color: #fff; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.3);
    border-radius: 11px; padding: 8px 12px; min-height: 42px; box-sizing: border-box; width: 170px; outline: none; -webkit-user-select: text; user-select: text; }
  #overlay input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,207,90,.35); }
  #overlay input::placeholder { color: rgba(255,255,255,.45); }
  .opt.join { padding: 6px 4px; gap: 8px; }
  #overlay .opt.join input.code { flex: 1; width: auto; min-width: 0; text-align: center; letter-spacing: 5px; text-transform: uppercase; font-size: 20px; }
  #overlay .opt.join button { flex: none; padding: 10px 22px; box-shadow: 0 3px 0 #c99a2e; }
  .roomcode { font-size: 46px; font-weight: 900; letter-spacing: 8px; color: var(--accent); text-align: center; -webkit-user-select: text; user-select: text; }
  .players { list-style: none; padding: 0; margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .players li { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgba(255,255,255,.1); }
  .players li i { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  .players li.teamhead { flex-basis: 100%; background: none; padding: 6px 0 0; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
  .players li.empty { background: none; font-size: 13px; font-weight: 600; opacity: .5; }
  .players li em { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; opacity: .6; }
  .panel .note { color: var(--accent); font-weight: 700; font-size: 14px; margin: 8px 6px; word-break: break-all; }
  .panel .wait { margin-top: 16px; opacity: .8; animation: pulse 1.8s ease-in-out infinite; }
  .rooms { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; padding: 2px; border-radius: 14px; }
  #overlay .rooms button.room { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; width: 100%; }
  .rooms button.room span { font-size: 13px; font-weight: 600; opacity: .8; }
  #overlay .rooms button.room.sel { border-color: var(--accent); background: rgba(255,207,90,.16); }
  #overlay .rooms button.room:disabled { opacity: .45; }
  .rooms p { margin: 6px; font-size: 14px; opacity: .8; }
  @media (max-width: 440px) { .opt .ctl b { min-width: 100px; font-size: 15px; } .opt .lab small { display: none; } #overlay .opt .ctl button { width: 34px; } }
  /* wide screens: the menu sits to the left so the bird and the mountain stay in view */
  @media (min-width: 980px) and (min-height: 560px) {
    #overlay:has(.side) { padding-left: max(6vw, 32px); background: linear-gradient(90deg, rgba(20,45,70,.45), rgba(20,45,70,.12) 45%, rgba(20,45,70,0) 70%); }
    .menu.side { width: 440px; margin-right: auto; } .side h1, .side .hint { text-align: left; }
  }
  @media (max-height: 500px) { .menu h1 { margin-bottom: 8px; } .panel .blurb { display: none; } }
  /* space mode */
  body.space { background: #020108; }
  body.space #overlay { background: linear-gradient(180deg, rgba(10,4,30,.35), rgba(20,6,40,.65)); }
  #boost { left: 16px; bottom: calc(36px + env(safe-area-inset-bottom)); width: 150px; height: 9px; border-radius: 5px; background: rgba(255,255,255,.18);
    display: none; align-items: center; box-shadow: 0 0 6px var(--shadow); }
  #boost i { display: block; height: 100%; border-radius: 5px; background: #7af0ff; transition: background .2s; }
  #boost b { position: absolute; left: 158px; font-size: 11px; font-weight: 900; letter-spacing: 2px; white-space: nowrap; }
  #boost.on i { background: #fff; box-shadow: 0 0 10px #7af0ff; }
  #boost.low i { background: #ff5a4a; }
  #pipper { position: fixed; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 2px solid rgba(140,255,170,.85); border-radius: 50%;
    pointer-events: none; display: none; box-shadow: 0 0 4px rgba(0,0,0,.4); }
  #pipper::after { content: ''; position: absolute; left: 15px; top: 15px; width: 4px; height: 4px; border-radius: 50%; background: rgba(140,255,170,.95); }
  /* space HUD: a flight reticle out ahead of your nose with throttle (left) and boost fuel (right) arcs,
     corner brackets on targets with a shield bar, arrows round the reticle pointing to fighters off screen */
  #sret { position: fixed; left: 0; top: 0; width: 140px; height: 140px; margin: -70px 0 0 -70px; pointer-events: none; display: none; }
  #sret svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 3px rgba(80,200,255,.45)); }
  #sret .t { fill: none; stroke: rgba(160,230,255,.22); stroke-width: 4; }
  #sret .f { fill: none; stroke: #8fe6ff; stroke-width: 4; }
  #sret .f.fuel { stroke: #ffc94a; } #sret .f.fuel.low { stroke: #ff5a4a; } #sret .f.boosting { stroke: #fff; }
  #sret .r { fill: none; stroke: rgba(190,240,255,.85); stroke-width: 1.6; }
  #sret text { fill: rgba(200,240,255,.9); font: 800 9px system-ui, sans-serif; letter-spacing: 1.5px; }
  #sret.drift .r { stroke: #ffc94a; }
  .offarrow { position: fixed; left: 0; top: 0; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-bottom: 12px solid #ff5a4a; margin: -6px 0 0 -7px; pointer-events: none; display: none; filter: drop-shadow(0 0 3px rgba(0,0,0,.6)); }
  .offarrow.prey { border-bottom-color: #ffb347; } .offarrow.dart { border-bottom-color: #fff; } .offarrow.locked { border-bottom-color: #7af0ff; }
  body.space .ret:not(.dart) { border: none; border-radius: 0; box-shadow: none; width: 34px; height: 34px; margin: -17px 0 0 -17px; --c: #ff5a4a;
    background: linear-gradient(var(--c),var(--c)) 0 0/9px 2px no-repeat, linear-gradient(var(--c),var(--c)) 0 0/2px 9px no-repeat,
      linear-gradient(var(--c),var(--c)) 100% 0/9px 2px no-repeat, linear-gradient(var(--c),var(--c)) 100% 0/2px 9px no-repeat,
      linear-gradient(var(--c),var(--c)) 0 100%/9px 2px no-repeat, linear-gradient(var(--c),var(--c)) 0 100%/2px 9px no-repeat,
      linear-gradient(var(--c),var(--c)) 100% 100%/9px 2px no-repeat, linear-gradient(var(--c),var(--c)) 100% 100%/2px 9px no-repeat;
    filter: drop-shadow(0 0 2px rgba(0,0,0,.7)); }
  body.space .ret.prey { --c: #ffb347; } body.space .ret.lock { --c: #fff; } body.space .ret.mylocking { --c: #7af0ff; }
  body.space .ret.mylocked { --c: #7af0ff; border: 2px solid #7af0ff; border-radius: 50%; }
  body.space .ret:not(.dart)::after { content: ''; position: absolute; left: 3px; right: 3px; bottom: -8px; height: 3px; background: linear-gradient(90deg, var(--c) var(--hp, 100%), rgba(255,255,255,.18) var(--hp, 100%)); }
  body.space .ret span { color: var(--c, #fff); letter-spacing: 1px; }
  body.space #hp { padding-top: 6px; font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #8fe6ff; display: flex; gap: 4px; align-items: center; }
  body.space #hp i { width: 26px; height: 8px; border-radius: 2px; background: #8fe6ff; box-shadow: 0 0 6px rgba(80,200,255,.6); }
  body.space #hp i.off { background: rgba(255,255,255,.15); box-shadow: none; }
  body.space #hp.crit i:not(.off) { background: #ff5a4a; box-shadow: 0 0 8px #ff5a4a; }
  #viewBtn { position: fixed; left: 50%; margin-left: -28px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 56px; height: 36px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,.6); background: rgba(20,40,60,.35); display: none; pointer-events: none;
    align-items: center; justify-content: center; font-weight: 900; font-size: 12px; letter-spacing: 1px; }
  /* touch throttle (space): a slider down the left edge, boost at the top, cruise in the notch, drift at the bottom */
  #throttle { position: fixed; left: calc(14px + env(safe-area-inset-left)); top: 26vh; bottom: calc(108px + env(safe-area-inset-bottom)); width: 34px;
    border-radius: 17px; border: 2px solid rgba(160,230,255,.55); display: none; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,200,80,.32) 0%, rgba(20,40,60,.3) 44%, rgba(20,40,60,.3) 56%, rgba(90,170,255,.32) 100%); }
  body.touch.space.flying #throttle { display: block; }
  #throttle b { position: absolute; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 900; letter-spacing: 1px; color: rgba(255,255,255,.7); }
  #throttle b.up { top: -16px; } #throttle b.dn { bottom: -16px; }
  #throttle .notch { position: absolute; left: -6px; right: -6px; top: 50%; height: 2px; margin-top: -1px; background: rgba(255,255,255,.6); }
  #thrKnob { position: absolute; left: -5px; right: -5px; top: 50%; height: 22px; margin-top: -11px; border-radius: 8px;
    background: rgba(200,240,255,.85); box-shadow: 0 0 10px rgba(120,220,255,.6); }
  #throttle.boosting #thrKnob { background: #ffd36a; box-shadow: 0 0 12px rgba(255,190,60,.8); }
  #throttle.drifting #thrKnob { background: #8fc8ff; box-shadow: 0 0 12px rgba(90,170,255,.8); }
  /* ---------- Safe areas: in landscape the notch and the rounded corners sit at the sides ---------- */
  #stats, #hp, #darts, #feed, #boost { margin-left: env(safe-area-inset-left); }
  #wave, #board, #radar, #fire, #dartBtn { margin-right: env(safe-area-inset-right); }
  /* ---------- Phone on its side: thumbs at the bottom corners ---------- */
  @media (pointer: coarse) and (orientation: landscape) {
    /* FIRE in the right thumb's corner, DART just above it, the tail radar between the thumbs */
    #fire { right: 18px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 80px; height: 80px; }
    #dartBtn { right: 22px; bottom: calc(110px + env(safe-area-inset-bottom)); width: 68px; height: 68px; }
    #radar { right: auto; left: 50%; width: 92px; height: 92px; margin: 0 0 0 -46px; bottom: calc(8px + env(safe-area-inset-bottom)); }
    #stats { bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 13px; max-width: calc(50vw - 70px); }
    #boost { bottom: calc(58px + env(safe-area-inset-bottom)); } /* above the stats, which can wrap to two lines here */
    /* space: the VIEW button sits beside FIRE so it doesn't cover the radar */
    #viewBtn { left: auto; right: 112px; margin: 0 env(safe-area-inset-right) 0 0; bottom: calc(38px + env(safe-area-inset-bottom)); }
  }
  @media (orientation: landscape) and (max-height: 540px) {
    #score { font-size: 28px; top: calc(8px + env(safe-area-inset-top)); }
    #combo { top: calc(42px + env(safe-area-inset-top)); }
    #warn { top: calc(64px + env(safe-area-inset-top)); font-size: 17px; }
    #hp { top: calc(8px + env(safe-area-inset-top)); }
    #darts { top: calc(38px + env(safe-area-inset-top)); }
    #feed { top: calc(66px + env(safe-area-inset-top)); max-width: 34vw; font-size: 12px; }
    #wave { top: calc(10px + env(safe-area-inset-top)); font-size: 14px; }
    #board { top: calc(34px + env(safe-area-inset-top)); }
    /* down cam: thinner letterbox so the replay keeps most of the screen */
    #downcam::before, #downcam::after { height: 7vh; }
    #downcam .lab { top: calc(7vh + 6px); }
    #downcam .lab b { font-size: 13px; } #downcam .lab span { font-size: 18px; }
    #downcam .bar { bottom: calc(7vh + 12px); }
    #downcam .skip { bottom: calc(7vh / 2 - 8px); }
    /* menus: two columns, the title and the main buttons on the left, the settings on the right */
    .menu h1 { font-size: 40px; margin: 0 0 8px; }
    .menu.split { width: min(860px, 100%); margin: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 14px; align-items: center; }
    .split h1 { text-align: left; margin-left: 6px; }
    .split .panel { padding: 10px; border-radius: 18px; }
    .split .panel.sets { --line: rgba(255,255,255,.16); max-height: calc(100vh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; box-sizing: border-box; }
    .split .sets > .sect:first-child { margin-top: 4px; }
    .split .hint { text-align: left; margin-left: 6px; }
    .split .panel .blurb { display: block; font-size: 13px; line-height: 1.35; margin: 8px 4px 0; }
    .split .opt { min-height: 42px; }
    .split .sect { margin: 10px 6px 2px; }
    .split .rooms { max-height: 150px; }
    #overlay .split .tabs button { min-width: 0; padding: 8px 2px; font-size: 14px; }
    .split .opt .ctl b { min-width: 96px; }
    #overlay .split .opt .ctl button { width: 34px; }
    .split .opt .lab { white-space: nowrap; }
    #overlay .split input#nameIn { width: 140px; }
    .split .sets .opt .lab { white-space: normal; }
    .split .roomcode { font-size: 34px; letter-spacing: 6px; }
    .split .players { margin: 2px 0; }
    #overlay .split button.cta { margin: 10px 0 0; font-size: 20px; padding: 10px; min-height: 48px; }
    @media (max-width: 760px) { .split .sets .opt .lab small { display: none; } .split .panel .blurb { font-size: 12px; } }
    /* crash and "downed" cards */
    .menu:not(.split) .panel.center { padding: 12px 18px; }
    .panel .score b { font-size: 40px; }
    #overlay .go { margin-top: 8px; }
  }
  /* ---------- Held upright: ask for landscape ---------- */
  #rotate { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px;
    text-align: center; background: radial-gradient(ellipse at 50% 40%, #3d7fae, #173450); color: #fff; touch-action: manipulation; }
  #rotate .phone { width: 46px; height: 80px; border: 4px solid #fff; border-radius: 10px; box-sizing: border-box; position: relative; margin-bottom: 14px; animation: turn 2.4s ease-in-out infinite; }
  #rotate .phone::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 10px; height: 3px; margin-left: -5px; border-radius: 2px; background: #fff; }
  @keyframes turn { 0%, 20% { transform: rotate(0); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  #rotate b { font-size: 26px; font-weight: 900; }
  #rotate p { margin: 0; font-size: 16px; opacity: .85; max-width: 280px; }
  #rotate .tap { display: none; margin-top: 10px; font-weight: 800; color: var(--accent); }
  #rotate.canlock .tap { display: block; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  #overlay { touch-action: pan-y; }
  #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6);
    background: rgba(255,255,255,.12); display: none; pointer-events: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.7); }
</style>
</head>
