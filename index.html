<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#9fd3f0" />
<title>Glide! Prototype</title>
<style>
  :root { --ink: #ffffff; --shadow: rgba(20, 40, 60, 0.45); --accent: #ffcf5a; --sky: #9fd3f0; }
  /* the game keeps its daytime palette in both colour schemes */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #ffffff; --sky: #9fd3f0; } }
  :root[data-theme="dark"] { --ink: #ffffff; --sky: #9fd3f0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  canvas { display: block; }
  #game { position: fixed; inset: 0; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 6px var(--shadow); }
  #score { top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 800; letter-spacing: 1px; }
  #combo { top: calc(52px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 16px; font-weight: 700; color: var(--accent); opacity: 0; transition: opacity .2s; }
  #stats { bottom: calc(12px + env(safe-area-inset-bottom)); left: 16px; font-size: 14px; font-weight: 600; opacity: .9; line-height: 1.4; }
  #skim { top: 38%; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 900; color: var(--accent); opacity: 0; letter-spacing: 3px; }
  #mist { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(255,255,255,.75), rgba(255,255,255,.98)); opacity: 0; }
  #edge { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(255, 120, 60, .8); opacity: 0; }
  .pop { position: fixed; left: 50%; top: 30%; transform: translate(-50%, 0); font-weight: 900; font-size: 24px; color: var(--accent);
    text-shadow: 0 2px 8px var(--shadow); pointer-events: none; animation: pop 1.1s ease-out forwards; white-space: nowrap; }
  .pop small { display: block; font-size: 14px; color: #fff; text-align: center; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px;
    background: linear-gradient(180deg, rgba(40,80,120,.25), rgba(40,80,120,.55)); }
  #overlay { overflow-y: auto; align-items: flex-start; }
  #overlay > div { margin: auto 0; } /* centred when it fits, scrolls from the top when it doesn't */
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: clamp(48px, 12vw, 96px); margin: 0 0 4px; letter-spacing: 2px; text-shadow: 0 4px 16px var(--shadow); }
  #overlay p { margin: 6px 0; font-size: 16px; text-shadow: 0 2px 6px var(--shadow); }
  #overlay .go { margin-top: 18px; font-size: 20px; font-weight: 800; color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  #overlay .controls { margin-top: 14px; font-size: 14px; opacity: .95; line-height: 1.6; }
  @keyframes pulse { 50% { opacity: .45; } }
  #hp { top: calc(12px + env(safe-area-inset-top)); left: 16px; font-size: 22px; letter-spacing: 2px; color: #ff6b6b; }
  #radar { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 112px; height: 112px; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #darts { top: calc(44px + env(safe-area-inset-top)); left: 16px; font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #7af0ff; display: flex; align-items: center; gap: 5px; opacity: 0; transition: opacity .3s; }
  #darts i { width: 8px; height: 22px; border-radius: 4px 4px 1px 1px; background: #7af0ff; box-shadow: 0 0 6px var(--shadow); }
  #darts i.off { background: rgba(255,255,255,.18); }
  #darts i.cd { background: linear-gradient(to top, #7af0ff var(--p), rgba(255,255,255,.18) var(--p)); }
  #darts.ready b { color: #fff; }
  #warn { top: calc(84px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 900; color: #ff5a4a; letter-spacing: 3px; opacity: 0; }
  #fire { position: fixed; right: 20px; bottom: calc(146px + env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.75); background: rgba(255,90,60,.35); display: none; pointer-events: none;
    align-items: center; justify-content: center; font-weight: 900; font-size: 15px; letter-spacing: 1px; }
  #dartBtn { position: fixed; right: 20px; bottom: calc(244px + env(safe-area-inset-bottom)); width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.75); background: rgba(70,200,230,.35); display: none; pointer-events: none;
    align-items: center; justify-content: center; font-weight: 900; font-size: 13px; letter-spacing: 1px; }
  #dartBtn.dim { opacity: .4; }
  .ret { position: fixed; left: 0; top: 0; width: 30px; height: 30px; margin: -17px 0 0 -17px; border: 2px solid #ff5a4a; border-radius: 4px;
    pointer-events: none; display: none; box-shadow: 0 0 6px var(--shadow); }
  .ret.prey { border-color: #ffb347; }
  .ret.lock { border-color: #fff; border-radius: 50%; border-width: 3px; }
  .ret.mylocking { border-color: #7af0ff; border-style: dashed; }
  .ret.mylocked { border-color: #7af0ff; border-radius: 50%; border-width: 3px; }
  .ret.dart { border-color: #ff3b2e; border-width: 3px; width: 22px; height: 22px; margin: -13px 0 0 -13px; background: rgba(255,59,46,.25); }
  /* lead marker: aim the gun cross at it */
  .lead { position: fixed; left: 0; top: 0; width: 18px; height: 18px; margin: -11px 0 0 -11px; border: 2px solid #ff5a4a; border-radius: 50%;
    pointer-events: none; display: none; box-shadow: 0 0 4px var(--shadow); }
  .lead::after { content: ''; position: absolute; left: 7px; top: 7px; width: 4px; height: 4px; border-radius: 50%; background: #fff; }
  #gunCross { position: fixed; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; display: none; }
  #gunCross::before, #gunCross::after { content: ''; position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 3px var(--shadow); }
  #gunCross::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #gunCross::after { top: 10px; left: 0; height: 2px; width: 22px; }
  .ret.dart span { transform: translateX(-50%) rotate(-45deg); color: #ff8a80; }
  .ret span { position: absolute; top: -19px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; white-space: nowrap; color: #fff; }
  #wave { top: calc(14px + env(safe-area-inset-top)); right: 16px; font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #fff; }
  /* online: scoreboard (top right, under the wave), kill feed (left), room menu */
  #board { top: calc(40px + env(safe-area-inset-top)); right: 16px; font-size: 13px; font-weight: 800; min-width: 130px; display: none; }
  #board b { display: block; font-size: 11px; letter-spacing: 2px; opacity: .8; margin-bottom: 2px; text-align: right; }
  #board div { display: flex; gap: 8px; justify-content: flex-end; }
  #board div.me span { text-decoration: underline; }
  #board i { font-style: normal; min-width: 18px; text-align: right; color: #fff; }
  #board i.d { opacity: .6; }
  #feed { top: calc(76px + env(safe-area-inset-top)); left: 16px; font-size: 13px; font-weight: 700; line-height: 1.5; display: none; max-width: 45vw; }
  #overlay input { font: inherit; font-weight: 800; font-size: 18px; color: #fff; background: rgba(20, 40, 60, .45); border: 2px solid rgba(255,255,255,.6);
    border-radius: 12px; padding: 9px 12px; min-height: 44px; box-sizing: border-box; width: 190px; outline: none; -webkit-user-select: text; user-select: text; }
  #overlay input:focus { border-color: var(--accent); }
  #overlay input.code { width: 150px; text-align: center; letter-spacing: 4px; text-transform: uppercase; }
  #overlay input::placeholder { color: rgba(255,255,255,.5); }
  .menu .modes button { min-width: 0; }
  .menu .roomcode { font-size: 46px; font-weight: 900; letter-spacing: 8px; color: var(--accent); text-shadow: 0 3px 10px var(--shadow); -webkit-user-select: text; user-select: text; }
  .menu .players { list-style: none; padding: 0; margin: 10px auto; font-weight: 800; font-size: 17px; text-shadow: 0 2px 6px var(--shadow); }
  .menu .note { color: var(--accent); font-weight: 700; max-width: 520px; margin: 6px auto; word-break: break-all; }
  .menu { max-width: 640px; }
  .menu .row { display: flex; gap: 10px; justify-content: center; align-items: center; margin: 8px auto; padding: 4px 10px; border-radius: 14px; border: 2px solid transparent; width: fit-content; }
  .menu .row.sel { border-color: rgba(255, 207, 90, .85); background: rgba(20, 40, 60, .25); }
  .menu .blurb { max-width: 520px; margin: 4px auto; }
  .menu .blurb.small { font-size: 14px; opacity: .9; margin-top: -4px; }
  .menu .lab { font-size: 14px; font-weight: 700; opacity: .85; min-width: 64px; text-align: right; }
  .menu .pick b { font-size: 18px; min-width: 150px; text-align: center; }
  .menu .hint { font-size: 13px; opacity: .8; }
  #overlay button { font: inherit; font-weight: 800; font-size: 16px; color: #fff; background: rgba(20, 40, 60, .45); border: 2px solid rgba(255,255,255,.6);
    border-radius: 12px; padding: 10px 16px; min-height: 44px; cursor: pointer; text-shadow: 0 1px 4px var(--shadow); touch-action: manipulation; }
  #overlay button.on { background: rgba(255, 207, 90, .9); color: #2a2a2a; text-shadow: none; border-color: #fff; }
  #overlay button.go-btn { font-size: 22px; padding: 12px 42px; background: rgba(255, 207, 90, .95); color: #2a2a2a; text-shadow: none; }
  .menu .pick button { min-width: 44px; padding: 8px 12px; }
  #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6);
    background: rgba(255,255,255,.12); display: none; pointer-events: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.7); }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="edge"></div>
  <div id="mist"></div>
  <div id="score" class="hud">0</div>
  <div id="combo" class="hud">x1</div>
  <div id="skim" class="hud">SKIM</div>
  <div id="stats" class="hud"></div>
  <div id="hp" class="hud"></div>
  <div id="wave" class="hud"></div>
  <div id="board" class="hud"></div>
  <div id="feed" class="hud"></div>
  <div id="warn" class="hud">▼ ON YOUR TAIL ▼</div>
  <canvas id="radar"></canvas>
  <div id="darts" class="hud"></div>
  <div id="fire">FIRE</div>
  <div id="dartBtn">DART</div>
  <div id="rets"></div>
  <div id="gunCross"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="overlay">
    <div>
      <h1>Glide!</h1>
      <p>An endless mountainside. Skim the ground, thread the trees, punch through the clouds, and shoot down the birds hunting you.</p>
      <div class="controls" id="controls"></div>
      <div class="go" id="go">Tap or press any key</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
